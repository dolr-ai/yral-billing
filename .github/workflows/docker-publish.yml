name: Build, Push and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cargo test
        run: cargo test --features=local -- --no-capture --test-threads=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: sarvesh-1
            role: primary
            ip_secret: YRAL_BILLING_SARVESH_1_SERVER_IP_ADDR
          - name: sarvesh-2
            role: edge
            ip_secret: YRAL_BILLING_SARVESH_2_SERVER_IP_ADDR
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_BARE_METAL_GITHUB_ACTIONS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${SERVER_IP}" >> ~/.ssh/known_hosts
        env:
          SERVER_IP: ${{ secrets[matrix.server.ip_secret] }}

      - name: Deploy to ${{ matrix.server.name }}
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          SERVER_ROLE: ${{ matrix.server.role }}
          SERVER_IP: ${{ secrets[matrix.server.ip_secret] }}
          PRIMARY_SERVER_IP: ${{ secrets.YRAL_BILLING_SARVESH_1_SERVER_IP_ADDR }}
          SERVER_USER: ${{ secrets.YRAL_BILLING_DEPLOY_USER }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BACKEND_ADMIN_SECRET_KEY: ${{ secrets.CANISTER_ADMIN_PRIVATE_SECRET_KEY }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_DEFAULT_ENVIRONMENT: ${{ vars.APPLE_DEFAULT_ENVIRONMENT || 'production' }}
          LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_BACKUP_OBJECT_STORAGE_ACCESS_KEY }}
          LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_BACKUP_OBJECT_STORAGE_SECRET_KEY }}
          LITESTREAM_S3_BUCKET: ${{ secrets.BUCKET_NAME_LITE_STREAM_BACKUP }}
          SENTRY_DSN: ${{ secrets.YRAL_BILLING_SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ vars.YRAL_BILLING_SENTRY_TRACES_SAMPLE_RATE || '1.0' }}
          APP_ENV: production

        run: |
          if [ "${SERVER_ROLE}" = "primary" ]; then
            APPLE_PRIVATE_KEY_B64="$(printf '%s' "${APPLE_PRIVATE_KEY}" | base64 -w 0)"

            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SERVER_USER}@${SERVER_IP} "mkdir -p ~/yral-billing"

            scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes docker-compose.yml ${SERVER_USER}@${SERVER_IP}:~/yral-billing/
            scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes litestream.yml ${SERVER_USER}@${SERVER_IP}:~/yral-billing/

            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SERVER_USER}@${SERVER_IP} << ENDSSH
              set -euo pipefail
              cd ~/yral-billing

              export GOOGLE_SERVICE_ACCOUNT_JSON='${GOOGLE_SERVICE_ACCOUNT_JSON}'
              export BACKEND_ADMIN_SECRET_KEY='${BACKEND_ADMIN_SECRET_KEY}'
              export APPLE_ISSUER_ID='${APPLE_ISSUER_ID}'
              export APPLE_KEY_ID='${APPLE_KEY_ID}'
              export APPLE_BUNDLE_ID='${APPLE_BUNDLE_ID}'
              export APPLE_PRIVATE_KEY="\$(printf '%s' '${APPLE_PRIVATE_KEY_B64}' | base64 -d)"
              export APPLE_DEFAULT_ENVIRONMENT='${APPLE_DEFAULT_ENVIRONMENT}'
              export LITESTREAM_ACCESS_KEY_ID='${LITESTREAM_ACCESS_KEY_ID}'
              export LITESTREAM_SECRET_ACCESS_KEY='${LITESTREAM_SECRET_ACCESS_KEY}'
              export LITESTREAM_S3_BUCKET='${LITESTREAM_S3_BUCKET}'
              export SENTRY_DSN='${SENTRY_DSN}'
              export SENTRY_TRACES_SAMPLE_RATE='${SENTRY_TRACES_SAMPLE_RATE}'
              export APP_ENV='${APP_ENV}'

              docker network inspect low_traffic_1 >/dev/null 2>&1 || docker network create low_traffic_1
              docker pull ghcr.io/dolr-ai/yral-billing:latest
              mkdir -p data
              docker run --rm --user root -v "\$PWD/data:/data" ghcr.io/dolr-ai/yral-billing:latest sh -c 'chmod 0777 /data && find /data -maxdepth 1 -type f -name "billing.db*" -exec chmod 0666 {} \;'
              docker rm -f yral-billing yral-billing-litestream >/dev/null 2>&1 || true
              docker compose up -d
              docker compose ps

              if docker ps --format '{{.Names}}' | grep -qx yral-proxy; then
                docker network connect low_traffic_1 yral-proxy 2>/dev/null || true
          python3 <<'PY'
          from pathlib import Path

          path = Path("/home/yral-deploy/yral-proxy/Caddyfile")
          block = [
              "billing.sarvesh.yral.com:443 {",
              "    tls /etc/caddy/certs/fullchain.pem /etc/caddy/certs/privkey.pem",
              "    reverse_proxy yral-billing:3000 {",
              "        health_uri /health",
              "        health_interval 30s",
              "        health_timeout 10s",
              "    }",
              "}",
          ]
          lines = path.read_text().splitlines()
          output = []
          i = 0

          while i < len(lines):
              if lines[i].strip() == "billing.sarvesh.yral.com:443 {":
                  depth = 0
                  while i < len(lines):
                      depth += lines[i].count("{") - lines[i].count("}")
                      i += 1
                      if depth <= 0:
                          break
                  while output and output[-1].strip() == "":
                      output.pop()
                  continue

              output.append(lines[i])
              i += 1

          while output and output[-1].strip() == "":
              output.pop()

          output.extend(["", *block])
          path.write_text("\n".join(output) + "\n")
          PY
                docker exec yral-proxy caddy validate --config /etc/caddy/Caddyfile
                docker restart yral-proxy
              fi
          ENDSSH
          else
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SERVER_USER}@${SERVER_IP} << ENDSSH
              set -euo pipefail
              export PRIMARY_SERVER_IP='${PRIMARY_SERVER_IP}'

              docker rm -f yral-billing yral-billing-litestream >/dev/null 2>&1 || true

              if docker ps --format '{{.Names}}' | grep -qx yral-proxy; then
          python3 <<'PY'
          import os
          from pathlib import Path

          primary_server_ip = os.environ["PRIMARY_SERVER_IP"]
          path = Path("/home/yral-deploy/yral-proxy/Caddyfile")
          block = [
              "billing.sarvesh.yral.com:443 {",
              "    tls /etc/caddy/certs/fullchain.pem /etc/caddy/certs/privkey.pem",
              f"    reverse_proxy https://{primary_server_ip} {{",
              "        header_up Host billing.sarvesh.yral.com",
              "        transport http {",
              "            tls_server_name billing.sarvesh.yral.com",
              "            tls_insecure_skip_verify",
              "        }",
              "    }",
              "}",
          ]
          lines = path.read_text().splitlines()
          output = []
          i = 0

          while i < len(lines):
              if lines[i].strip() == "billing.sarvesh.yral.com:443 {":
                  depth = 0
                  while i < len(lines):
                      depth += lines[i].count("{") - lines[i].count("}")
                      i += 1
                      if depth <= 0:
                          break
                  while output and output[-1].strip() == "":
                      output.pop()
                  continue

              output.append(lines[i])
              i += 1

          while output and output[-1].strip() == "":
              output.pop()

          output.extend(["", *block])
          path.write_text("\n".join(output) + "\n")
          PY
                docker exec yral-proxy caddy validate --config /etc/caddy/Caddyfile
                docker restart yral-proxy
              fi
          ENDSSH
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
