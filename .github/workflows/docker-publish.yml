name: Build, Push and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cargo test
        run: cargo test --features=local -- --no-capture --test-threads=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: sarvesh-1
            ip_secret: YRAL_BILLING_SARVESH_1_SERVER_IP_ADDR
          - name: sarvesh-2
            ip_secret: YRAL_BILLING_SARVESH_2_SERVER_IP_ADDR
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_BARE_METAL_GITHUB_ACTIONS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${SERVER_IP}" >> ~/.ssh/known_hosts
        env:
          SERVER_IP: ${{ secrets[matrix.server.ip_secret] }}

      - name: Deploy to ${{ matrix.server.name }}
        env:
          SERVER_IP: ${{ secrets[matrix.server.ip_secret] }}
          SERVER_USER: ${{ secrets.YRAL_BILLING_DEPLOY_USER }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BACKEND_ADMIN_SECRET_KEY: ${{ secrets.DOLR_AI_SNS_PROPOSAL_SUBMISSION_IDENTITY_PRIVATE_KEY }}
          LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_BACKUP_OBJECT_STORAGE_ACCESS_KEY }}
          LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_BACKUP_OBJECT_STORAGE_SECRET_KEY }}
          LITESTREAM_S3_BUCKET: ${{ secrets.BUCKET_NAME_LITE_STREAM_BACKUP }}
          APP_ENV: production

        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SERVER_USER}@${SERVER_IP} "mkdir -p ~/yral-billing"

          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes docker-compose.yml ${SERVER_USER}@${SERVER_IP}:~/yral-billing/
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes litestream.yml ${SERVER_USER}@${SERVER_IP}:~/yral-billing/
          
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes ${SERVER_USER}@${SERVER_IP} << ENDSSH
            cd ~/yral-billing

            export GOOGLE_SERVICE_ACCOUNT_JSON='${GOOGLE_SERVICE_ACCOUNT_JSON}'
            export BACKEND_ADMIN_SECRET_KEY='${BACKEND_ADMIN_SECRET_KEY}'
            export LITESTREAM_ACCESS_KEY_ID='${LITESTREAM_ACCESS_KEY_ID}'
            export LITESTREAM_SECRET_ACCESS_KEY='${LITESTREAM_SECRET_ACCESS_KEY}'
            export LITESTREAM_S3_BUCKET='${LITESTREAM_S3_BUCKET}'
            export APP_ENV='${APP_ENV}'

            docker network inspect low_traffic_1 >/dev/null 2>&1 || docker network create low_traffic_1
            docker pull ghcr.io/dolr-ai/yral-billing:latest
            docker compose up -d
            docker compose ps
          ENDSSH

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
